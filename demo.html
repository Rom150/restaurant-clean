<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Demo App — Merc / Fiches / Inventory / Bilan (imports)</title>
  <style>
    :root{--accent:#0a84ff;--bg:#f6f7fb;--card:#fff;--muted:#666}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);margin:0;padding:18px}
    .wrap{max-width:1100px;margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    h1{margin:0}
    nav a{margin-right:12px;text-decoration:none;color:#333;padding:6px 10px;border-radius:8px;cursor:pointer}
    nav a.active{background:var(--accent);color:#fff}
    .grid{display:grid;grid-template-columns:1fr 360px;gap:18px}
    .card{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 6px 18px rgba(10,10,20,0.04)}
    label{display:block;font-size:90%;color:var(--muted);margin-bottom:6px}
    textarea,input{width:100%;padding:8px;border-radius:8px;border:1px solid #ddd;font:inherit;box-sizing:border-box}
    button{background:var(--accent);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
    button.ghost{background:transparent;color:var(--accent);border:1px solid #e6eefc}
    pre{background:#0b1220;color:#dfeffc;padding:12px;border-radius:8px;overflow:auto;max-height:360px;font-size:13px}
    img.preview{max-width:100%;border-radius:8px;margin-top:8px;object-fit:cover;max-height:220px}
    .controls{display:flex;gap:8px;flex-wrap:wrap}
    .muted{color:var(--muted);font-size:13px;margin-top:6px}
    .small{font-size:13px;color:#555}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Demo App</h1>
        <div class="muted">Backend attendu sur <code>http://localhost:3000</code></div>
      </div>
      <nav id="nav">
        <a href="#" data-page="merc" class="active">Mercuriale</a>
        <a href="#" data-page="fiches">Fiches (import)</a>
        <a href="#" data-page="inventory">Inventaire</a>
        <a href="#" data-page="bilan">Bilan</a>
      </nav>
    </header>

    <main>
      <div class="grid">
        <div id="content" class="card">
          <!-- content injected by JS -->
        </div>

        <aside class="card">
          <h3>Actions rapides</h3>
          <div style="margin-bottom:10px">
            <label>Ajouter stock</label>
            <input id="quick-name" type="text" value="tomate" />
            <input id="quick-qty" type="number" value="5" style="margin-top:8px" />
            <div style="margin-top:8px" class="controls">
              <button id="quick-add">Ajouter</button>
              <button id="quick-consume" class="ghost">Consommer 1</button>
            </div>
            <div class="small" style="margin-top:8px">Inventory CSV: une ligne par ingrédient <code>nom,qty</code></div>
          </div>

          <hr/>

          <div>
            <label>Bilan (dernier)</label>
            <pre id="side-bilan">—</pre>
            <div style="margin-top:8px" class="controls">
              <button id="side-refresh-bilan" class="ghost">Rafraîchir Bilan</button>
            </div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const BASE = 'http://localhost:3000';

      const pages = { merc: mercPage, fiches: fichesPage, inventory: inventoryPage, bilan: bilanPage };

      const nav = document.getElementById('nav');
      nav.addEventListener('click', (e) => {
        const a = e.target.closest('a[data-page]');
        if (!a) return;
        e.preventDefault();
        nav.querySelectorAll('a').forEach(x => x.classList.remove('active'));
        a.classList.add('active');
        loadPage(a.dataset.page);
      });

      // quick actions
      document.getElementById('quick-add').addEventListener('click', async () => {
        const name = document.getElementById('quick-name').value;
        const qty = Number(document.getElementById('quick-qty').value || 0);
        if (!name || qty <= 0) return alert('Name and qty required');
        try {
          const r = await fetch(BASE + '/inventory/add', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, qty })
          });
          const j = await r.json();
          alert('Ajouté: ' + JSON.stringify(j));
          if (currentPage === 'inventory') loadPage('inventory');
        } catch (err) { alert(String(err)); }
      });

      document.getElementById('quick-consume').addEventListener('click', async () => {
        const name = document.getElementById('quick-name').value;
        try {
          const r = await fetch(BASE + '/inventory/consume', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, qty: 1 })
          });
          const j = await r.json();
          alert('Consommé: ' + JSON.stringify(j));
          if (currentPage === 'inventory') loadPage('inventory');
        } catch (err) { alert(String(err)); }
      });

      document.getElementById('side-refresh-bilan').addEventListener('click', () => loadSideBilan());

      let currentPage = 'merc';
      function setContent(html) { document.getElementById('content').innerHTML = html; }

      // Mercuriale page (with import)
      async function mercPage() {
        setContent('<h2>Mercuriale</h2><div id="merc-list">Chargement…</div>' +
          '<hr />' +
          '<h3>Importer facture / mercuriale</h3>' +
          '<label>Fichier texte (une ligne = item) ou coller le texte</label>' +
          '<input id="merc-file" type="file" accept=".txt,.csv" />' +
          '<textarea id="merc-text" rows="4" style="margin-top:8px"></textarea>' +
          '<div style="margin-top:8px" class="controls"><button id="btn-merc-import">Importer</button></div>' +
          '<pre id="merc-import-result">—</pre>');
        // load list
        try {
          const res = await fetch(BASE + '/merc/items');
          const data = await res.json();
          const html = '<ul>' + data.map(i => `<li>${escapeHtml(i.name)} — ${i.price} €</li>`).join('') + '</ul>';
          document.getElementById('merc-list').innerHTML = html;
        } catch (e) { document.getElementById('merc-list').textContent = 'Erreur: ' + e; }

        // file reading
        document.getElementById('merc-file').addEventListener('change', (ev) => {
          const f = ev.target.files && ev.target.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = () => { document.getElementById('merc-text').value = String(r.result || ''); };
          r.readAsText(f);
        });

        document.getElementById('btn-merc-import').addEventListener('click', async () => {
          const text = document.getElementById('merc-text').value || '';
          if (!text.trim()) return alert('Texte vide');
          document.getElementById('merc-import-result').textContent = 'Import en cours…';
          try {
            const res = await fetch(BASE + '/merc/import', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text })
            });
            const j = await res.json();
            document.getElementById('merc-import-result').textContent = JSON.stringify(j, null, 2);
          } catch (err) { document.getElementById('merc-import-result').textContent = String(err); }
        });
      }

      // Fiches page (with import)
      async function fichesPage() {
        setContent('<h2>Fiches techniques (import)</h2>' +
          '<label>Nom fiche</label><input id="fiche-name" type="text" value="Recette demo" />' +
          '<label style="margin-top:8px">Fichier texte (une ligne = ingrédient) ou coller le texte</label>' +
          '<input id="fiche-file" type="file" accept=".txt,.md" />' +
          '<textarea id="fiche-text" rows="6" style="margin-top:8px">tomate\npommes\nfromage</textarea>' +
          '<div style="margin-top:8px" class="controls"><button id="btn-fiche-import">Importer fiche</button></div>' +
          '<label style="margin-top:12px">Résultat</label><pre id="fiche-result">—</pre>');

        document.getElementById('fiche-file').addEventListener('change', (ev) => {
          const f = ev.target.files && ev.target.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = () => { document.getElementById('fiche-text').value = String(r.result || ''); };
          r.readAsText(f);
        });

        document.getElementById('btn-fiche-import').addEventListener('click', async () => {
          const name = document.getElementById('fiche-name').value || undefined;
          const text = document.getElementById('fiche-text').value || '';
          if (!text.trim()) return alert('Texte vide');
          document.getElementById('fiche-result').textContent = 'Import en cours…';
          try {
            const res = await fetch(BASE + '/fiches-techniques/import', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, text })
            });
            const j = await res.json();
            document.getElementById('fiche-result').textContent = JSON.stringify(j, null, 2);
            loadSideBilan();
          } catch (err) { document.getElementById('fiche-result').textContent = String(err); }
        });
      }

      // Inventory page (with CSV import)
      async function inventoryPage() {
        setContent('<h2>Inventaire</h2><div id="inv-list">Chargement…</div>' +
          '<hr />' +
          '<h3>Importer inventaire (CSV)</h3>' +
          '<div class="small">Format: une ligne par ingrédient. séparateur: virgule ou tab. Exemple: <code>tomate,5</code></div>' +
          '<input id="inv-file" type="file" accept=".csv,.txt" />' +
          '<textarea id="inv-text" rows="6" style="margin-top:8px"></textarea>' +
          '<div style="margin-top:8px" class="controls"><button id="btn-inv-import">Importer CSV</button></div>' +
          '<label style="margin-top:12px">Résultat</label><pre id="inv-result">—</pre>');

        // load inventory
        try {
          const res = await fetch(BASE + '/inventory');
          const data = await res.json();
          if (!Array.isArray(data) || data.length === 0) document.getElementById('inv-list').innerHTML = '<div>Inventaire vide</div>';
          else {
            const html = '<table style="width:100%;border-collapse:collapse"><thead><tr><th>Nom</th><th>Qty</th></tr></thead><tbody>' +
              data.map(it => `<tr><td style="padding:6px;border-top:1px solid #eee">${escapeHtml(it.name)}</td><td style="padding:6px;border-top:1px solid #eee">${it.qty}</td></tr>`).join('') +
              '</tbody></table>';
            document.getElementById('inv-list').innerHTML = html;
          }
        } catch (e) { document.getElementById('inv-list').textContent = 'Erreur: ' + e; }

        document.getElementById('inv-file').addEventListener('change', (ev) => {
          const f = ev.target.files && ev.target.files[0];
          if (!f) return;
          const r = new FileReader();
          r.onload = () => { document.getElementById('inv-text').value = String(r.result || ''); };
          r.readAsText(f);
        });

        document.getElementById('btn-inv-import').addEventListener('click', async () => {
          const text = document.getElementById('inv-text').value || '';
          if (!text.trim()) return alert('Texte vide');
          document.getElementById('inv-result').textContent = 'Traitement en cours…';
          const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
          const results = [];
          for (const line of lines) {
            // parse CSV simple: name,qty
            const parts = line.split(/[,\t]+/).map(p => p.trim());
            const name = parts[0];
            const qty = Number(parts[1] || 1);
            if (!name) { results.push({ line, ok: false, reason: 'no name' }); continue; }
            try {
              const res = await fetch(BASE + '/inventory/add', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, qty })
              });
              const j = await res.json();
              results.push({ line, ok: true, resp: j });
            } catch (err) {
              results.push({ line, ok: false, reason: String(err) });
            }
          }
          document.getElementById('inv-result').textContent = JSON.stringify(results, null, 2);
          if (currentPage === 'inventory') loadPage('inventory');
        });
      }

      async function bilanPage() {
        setContent('<h2>Bilan</h2><div id="bilan-wrap">Chargement…</div>');
        try {
          const res = await fetch(BASE + '/bilan/summary');
          const data = await res.json();
          document.getElementById('bilan-wrap').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
          document.getElementById('bilan-wrap').insertAdjacentHTML('beforeend', '<div style="margin-top:8px"><button id="bilan-refresh" class="ghost">Rafraîchir</button></div>');
          document.getElementById('bilan-refresh').addEventListener('click', bilanPage);
        } catch (e) { document.getElementById('bilan-wrap').textContent = 'Erreur: ' + e; }
      }

      function escapeHtml(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]); }

      async function loadSideBilan() {
        try {
          const res = await fetch(BASE + '/bilan/summary');
          const j = await res.json();
          document.getElementById('side-bilan').textContent = JSON.stringify(j, null, 2);
        } catch (e) { document.getElementById('side-bilan').textContent = String(e); }
      }

      async function loadPage(name) {
        currentPage = name;
        if (pages[name]) await pages[name]();
        else setContent('<div>Page not found</div>');
      }

      // initial
      loadPage('merc');
      loadSideBilan();
    });
  </script>
</body>
</html>
